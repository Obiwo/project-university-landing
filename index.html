<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeffrey - Portal Universitario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grid-container">
        <!-- Sección 1: Project University (Grande) -->
        <div class="grid-item black-box project-university" data-section="project-university">
            <h2>Project<br>University</h2>
        </div>
        
        <!-- Sección 2: Pisos -->
        <div class="grid-item red-box pisos" data-section="pisos">
            <h2>Pisos</h2>
            <div class="icon-pisos">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </div>
        
        <!-- Sección 3: Grupos de Whatsapp -->
        <div class="grid-item gray-box whatsapp" data-section="whatsapp">
            <h2>Grupos de<br>WhatsApp</h2>
            <svg class="icon-whatsapp" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 C 27.5 10 9 28.5 9 51 C 9 58.5 11 65.5 14.5 71.5 L 10 90 L 29.5 85.5 C 35 88.5 41.5 90 48.5 90 C 71 90 89.5 71.5 89.5 49 C 89.5 27 71 10 50 10 Z M 50 20 C 65.5 20 78.5 33 78.5 48.5 C 78.5 64 65.5 77 50 77 C 44.5 77 39.5 75.5 35 73 L 22 76 L 25 63.5 C 22 58.5 20 53 20 47 C 20 31.5 33 20 50 20 Z" fill="currentColor"/>
                <circle cx="35" cy="45" r="2" fill="currentColor"/>
                <path d="M 42 42 Q 45 38 48 42 L 55 50 Q 58 53 62 49" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        
        <!-- Sección 4: Noticias (Grande) -->
        <div class="grid-item gray-box noticias" data-section="noticias">
            <div class="noticias-content">
                <div class="quote-marks">
                    <span class="quote-left">"</span>
                    <span class="quote-right">"</span>
                </div>
                <h2>Noticias</h2>
                <div class="news-lines">
                    <div class="news-line"></div>
                    <div class="news-line short"></div>
                    <div class="news-line"></div>
                </div>
            </div>
        </div>
        
        <!-- Sección 5: PUC (Grande vertical) -->
        <div class="grid-item black-box puc" data-section="puc">
            <h2 class="puc-text">PUC</h2>
        </div>
        
        <!-- Sección 6: Descuentos -->
        <div class="grid-item red-box descuentos" data-section="descuentos">
            <h2>Descuentos</h2>
            <div class="percent-icon">%</div>
        </div>
        
        <!-- Sección 7: Viajes -->
        <div class="grid-item red-box viajes" data-section="viajes">
            <h2>Viajes</h2>
            <svg class="icon-plane" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M 85 30 L 50 45 L 20 35 L 15 40 L 35 50 L 25 65 L 15 63 L 12 67 L 22 72 L 27 82 L 31 79 L 29 69 L 44 59 L 54 79 L 59 74 L 49 44 L 64 9 Z" fill="white"/>
            </svg>
        </div>
        
        <!-- Sección 8: 404 Not Found -->
        <div class="grid-item gray-box not-found" data-section="404">
            <h2 class="not-found-text">404<br><span>NOT FOUND</span></h2>
        </div>
    </div>
    
    <div class="logo-line-h"></div>
    <div class="logo-line-v"></div>
    <div class="logo-badge">
        <img src="logo.PNG" alt="Logo">
    </div>

    <script src="script.js"></script>
</body>
</html>
